<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack Practice App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; }
        input { width: 70%; padding: 8px; margin-right: 5px; }
        button { padding: 8px 12px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { padding: 8px; background: #eee; margin-bottom: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Task Manager</h2>
    <input type="text" id="taskInput" placeholder="Enter new task...">
    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>
</div>

<script>
    // Server (Flask Backend) se tasks fetch karne ka function
    async function loadTasks() {
        const response = await fetch('/api/tasks');
        const tasks = await response.json();
        const listContainer = document.getElementById('taskList');
        listContainer.innerHTML = '';

        tasks.forEach(task => {
            const li = document.createElement('li');
            li.textContent = task.title;
            listContainer.appendChild(li);
        });
    }

    // Backend par naya task bhejney (POST) ka function
    async function addTask() {
        const input = document.getElementById('taskInput');
        const title = input.value.trim();

        if (!title) return;

        await fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title })
        });

        input.value = '';
        loadTasks(); // Tasks list refresh karein
    }

    // Page load hone par tasks get karein
    loadTasks();
</script>

</body>
</html>
